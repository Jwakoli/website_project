<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Submit Form</title>
</head>
<body>
  <div>
   <link rel="stylesheet" href="style.css"> <div class="form-wrapper">
    <form class="modern-form">
        <h2>Get in Touch</h2>
        <p class="subtitle">We'd love to hear from you.</p>

        <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="e.g. Alex Omondi" required>
        </div>

        <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+254712345678" required>                               
        </div>
         
        <div class="input-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Reason for contact" required>                  ~

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="alex@example.com" required>
        </div>

        <div class="input-group">
            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="How can we help?"></textarea>
        </div>

        <button type="submit" class="submit-btn">
            Send Message
            <span class="icon">→</span>
        </button>
    </form>
</div>
</body>
</html>
